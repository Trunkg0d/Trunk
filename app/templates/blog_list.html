{% extends "base.html" %}

{% block content %}
<section class="max-w-4xl mx-auto py-12 px-4">
    <h1 class="text-3xl font-bold text-slate-100 mb-8">Research Publications & Notes</h1>
    
    <div class="grid gap-8 md:grid-cols-2">
        {% if posts %}
            {% for post in posts %}
            <div class="bg-slate-800 border border-slate-700 p-6 rounded-lg hover:border-blue-500 transition-colors">
                <span class="text-xs font-mono text-blue-400 uppercase tracking-widest">{{ post.category }}</span>
                <h2 class="text-xl font-semibold text-white mt-2 mb-3">
                    <a href="/blog/{{ post.category }}/{{ post.slug }}" class="hover:underline">
                        {{ post.title }}
                    </a>
                </h2>
                <p class="text-slate-400 text-sm mb-4">
                    {{ post.summary }}
                </p>
                <div class="text-slate-500 text-xs">
                    <span>{{ post.date }}</span>
                </div>
            </div>
            {% endfor %}
        {% else %}
            <div class="col-span-2 text-center py-20 border-2 border-dashed border-slate-800 rounded-xl">
                <p class="text-slate-500 italic">No research posts found in app/content/ yet.</p>
            </div>
        {% endif %}
    </div>
</section>
{% endblock %}
