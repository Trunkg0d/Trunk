<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Pham Hoang Trung | AI Researcher</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <script>
        window.MathJax = {
            tex: {
            inlineMath: [['$', '$'], ['\\(', '\\)']],
            displayMath: [['$$', '$$'], ['\\[', '\\]']],
            processEscapes: true
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen">
    <nav class="border-b border-slate-800 p-4 sticky top-0 bg-slate-900/80 backdrop-blur-md z-50">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <a href="/" class="font-bold text-xl text-blue-400">TRUNG.AI</a>
            <div class="space-x-6">
                <a href="/" class="hover:text-blue-400">Home</a>
                <a href="/blog" class="hover:text-blue-400">Blog</a>
                <a href="/projects" class="hover:text-blue-400">Projects</a>
                <a href="/resume" class="hover:text-blue-400">Resume</a>
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto p-6">
        {% block content %}{% endblock %}
    </main>

    <footer class="border-t border-slate-800 mt-20 p-8 text-center text-slate-500">
        <p>© 2024 Le Pham Hoang Trung - AI Researcher</p>
        <p class="text-xs mt-2">Built with FastAPI & Tailwind</p>
    </footer>
</body>
</html>
